<section id="projects" class="projects-section">
  <div class="container">
    <app-section-heading
      eyebrow="Portfolio"
      heading="My Projects"
      description="Eine Auswahl meiner bisherigen IT-Projekte aus meinem Studium und meiner persönlichen Entwicklung."
    ></app-section-heading>
  </div>

  <div class="marquee-stack" appScrollReveal>
    @for (row of rows(); track $index) {
      <div class="marquee-row" [class.no-loop]="!isLooping()">
        <div
          class="marquee-track"
          [style.--marquee-duration]="row.durationSeconds + 's'"
          [style.--marquee-copies]="row.copies"
        >
          @for (project of row.looped; track $index; let i = $index) {
            <app-project-card
              [project]="project"
              [widthPx]="widthFor(i % row.items.length)"
              [decorative]="i >= row.items.length"
              (selected)="openProject($event)"
            ></app-project-card>
          }
        </div>
      </div>
    }
  </div>
</section>

@if (selectedProject()) {
  <app-project-modal
    [project]="selectedProject()!"
    (closeRequested)="closeProject()"
  ></app-project-modal>
}
